name: VUEO Central Build and Publish

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "app/**"
      - "tv/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradlew"
      - "gradlew.bat"

  repository_dispatch:
    types:
      - vueo_build

permissions:
  contents: write

concurrency:
  group: vueo-dev-publish
  cancel-in-progress: true

jobs:
  build-publish:
    name: Build, Sign and Publish VUEO
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Confirm updater is installed
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/vueo/app/core/update/VueoUpdateManager.kt"

          test -f "$FILE" || {
            echo "::error::VUEO updater source is missing."
            exit 1
          }

          grep -q "VUEO_DEV_RELEASE_MANIFEST" "$FILE" || {
            echo "::error::VUEO updater release manifest support is missing."
            exit 1
          }

          TV_FILE="tv/src/main/java/com/vueotv/app/update/VueoTvUpdateManager.kt"

          test -f "$TV_FILE" || {
            echo "::error::VUEO TV updater source is missing."
            exit 1
          }

          grep -q "VUEO_TV_DEV_RELEASE_MANIFEST" "$TV_FILE" || {
            echo "::error::VUEO TV updater release manifest support is missing."
            exit 1
          }

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VUEO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VUEO_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing VUEO_KEYSTORE_BASE64 or VUEO_KEYSTORE_PASSWORD."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew || {
            echo "::error::gradlew is missing."
            exit 1
          }

          test -f ./gradle/wrapper/gradle-wrapper.properties || {
            echo "::error::Gradle wrapper properties are missing."
            exit 1
          }

          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -n "${ANDROID_HOME:-}" ] && \
               [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "::error::sdkmanager was not found."
              exit 1
            fi
          fi

          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --channel=0 \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Prepare signed release metadata
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VUEO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VUEO_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          VERSION_CODE="$(date -u +%s)"

          if [ "$VERSION_CODE" -ge 2100000000 ]; then
            echo "::error::Generated Android versionCode is too large."
            exit 1
          fi

          BASE_VERSION="$(
            python3 <<'PY'
          from pathlib import Path
          import re

          text = Path("app/build.gradle.kts").read_text(encoding="utf-8")

          patterns = [
              r'versionName\s*=\s*vueoCiVersionName\s*\?:\s*"([^"]+)"',
              r'versionName\s*=\s*"([^"]+)"',
          ]

          value = None

          for pattern in patterns:
              match = re.search(pattern, text)
              if match:
                  value = match.group(1).strip()
                  break

          print(value or "0.0.0")
          PY
          )"

          VERSION_NAME="${BASE_VERSION}-dev.${VERSION_CODE}"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/vueo-dev-signing.jks"

          test -s "$RUNNER_TEMP/vueo-dev-signing.jks" || {
            echo "::error::Decoded signing keystore is empty."
            exit 1
          }

          {
            echo "VUEO_VERSION_CODE=$VERSION_CODE"
            echo "VUEO_VERSION_NAME=$VERSION_NAME"
            echo "VUEO_KEYSTORE_PATH=$RUNNER_TEMP/vueo-dev-signing.jks"
            echo "VUEO_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "Building VUEO $VERSION_NAME ($VERSION_CODE)"

      - name: Build signed Mobile and TV release APKs
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleRelease \
            :tv:assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Verify signed APKs
        shell: bash
        run: |
          set -euo pipefail

          MOBILE_APK="app/build/outputs/apk/release/app-release.apk"
          TV_APK="tv/build/outputs/apk/release/tv-release.apk"

          test -s "$MOBILE_APK" || {
            echo "::error::Mobile release APK was not generated."
            exit 1
          }

          test -s "$TV_APK" || {
            echo "::error::TV release APK was not generated."
            exit 1
          }

          APKSIGNER="$(find "${ANDROID_HOME}" -path "*/build-tools/36.0.0/apksigner" -print -quit)"
          AAPT="$(find "${ANDROID_HOME}" -path "*/build-tools/36.0.0/aapt" -print -quit)"

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner 36.0.0 was not found."
            exit 1
          fi

          if [ -z "$AAPT" ] || [ ! -x "$AAPT" ]; then
            echo "::error::aapt 36.0.0 was not found."
            exit 1
          fi

          for APK in "$MOBILE_APK" "$TV_APK"; do
            echo "Verifying signature: $APK"
            "$APKSIGNER" verify \
              --verbose \
              --print-certs \
              "$APK"
          done

          MOBILE_PACKAGE="$(
            "$AAPT" dump badging "$MOBILE_APK" \
              | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" \
              | head -n 1
          )"

          TV_PACKAGE="$(
            "$AAPT" dump badging "$TV_APK" \
              | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" \
              | head -n 1
          )"

          echo "Mobile APK package: $MOBILE_PACKAGE"
          echo "TV APK package: $TV_PACKAGE"

          if [ "$MOBILE_PACKAGE" != "com.vueo.app" ]; then
            echo "::error::Mobile APK has wrong package ID: $MOBILE_PACKAGE"
            exit 1
          fi

          if [ "$TV_PACKAGE" != "com.vueo.app.tv" ]; then
            echo "::error::TV APK has wrong package ID: $TV_PACKAGE (expected com.vueo.app.tv)"
            exit 1
          fi

          echo "Package ID verification passed."

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp \
            app/build/outputs/apk/release/app-release.apk \
            dist/VUEO-dev.apk

          cp \
            tv/build/outputs/apk/release/tv-release.apk \
            dist/VUEOTV-dev.apk

          AAPT="$(find "${ANDROID_HOME}" -path "*/build-tools/36.0.0/aapt" -print -quit)"
          test -x "$AAPT" || {
            echo "::error::aapt 36.0.0 was not found for final APK verification."
            exit 1
          }

          FINAL_TV_PACKAGE="$(
            "$AAPT" dump badging dist/VUEOTV-dev.apk \
              | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" \
              | head -n 1
          )"

          echo "Final published TV APK package: $FINAL_TV_PACKAGE"

          if [ "$FINAL_TV_PACKAGE" != "com.vueo.app.tv" ]; then
            echo "::error::Final VUEOTV-dev.apk has wrong package ID: $FINAL_TV_PACKAGE"
            exit 1
          fi

          MOBILE_SHA256="$(
            sha256sum dist/VUEO-dev.apk \
              | awk '{print $1}'
          )"

          TV_SHA256="$(
            sha256sum dist/VUEOTV-dev.apk \
              | awk '{print $1}'
          )"

          PUBLISHED_AT="$(
            date -u +'%Y-%m-%dT%H:%M:%SZ'
          )"

          COMMIT_SHA="$(
            git rev-parse HEAD
          )"

          export MOBILE_SHA256 TV_SHA256 PUBLISHED_AT COMMIT_SHA

          python3 <<'PY'
          from pathlib import Path
          import json
          import os

          payload = {
              "schemaVersion": 1,
              "versionCode": int(
                  os.environ["VUEO_VERSION_CODE"]
              ),
              "versionName":
                  os.environ["VUEO_VERSION_NAME"],
              "title":
                  "VUEO " +
                  os.environ["VUEO_VERSION_NAME"],
              "changelog": [
                  "Latest successful VUEO development build",
                  "Commit " +
                  os.environ["COMMIT_SHA"][:7],
              ],
              "downloadUrl":
                  "https://github.com/nudroid12/VUEO/releases/download/vueo-dev/VUEO-dev.apk",
              "sha256":
                  os.environ["MOBILE_SHA256"],
              "publishedAt":
                  os.environ["PUBLISHED_AT"],
          }

          Path("dist/update.json").write_text(
              json.dumps(
                  payload,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          tv_payload = {
              "schemaVersion": 1,
              "versionCode": int(
                  os.environ["VUEO_VERSION_CODE"]
              ),
              "versionName":
                  os.environ["VUEO_VERSION_NAME"],
              "title":
                  "VUEO TV " +
                  os.environ["VUEO_VERSION_NAME"],
              "changelog": [
                  "Latest successful VUEO TV development build",
                  "Commit " +
                  os.environ["COMMIT_SHA"][:7],
              ],
              "downloadUrl":
                  "https://github.com/nudroid12/VUEO/releases/download/vueo-dev/VUEOTV-dev.apk",
              "sha256":
                  os.environ["TV_SHA256"],
              "publishedAt":
                  os.environ["PUBLISHED_AT"],
          }

          Path("dist/tv-update.json").write_text(
              json.dumps(
                  tv_payload,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

          sha256sum dist/VUEO-dev.apk \
            > dist/VUEO-dev.apk.sha256

          sha256sum dist/VUEOTV-dev.apk \
            > dist/VUEOTV-dev.apk.sha256

          echo "Release files:"
          ls -lh dist/

      - name: Publish rolling VUEO Dev release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view vueo-dev >/dev/null 2>&1; then
            gh release create vueo-dev \
              --target main \
              --title "VUEO Dev" \
              --prerelease \
              --notes "Rolling development release. Only successful signed builds are published."
          fi

          # Remove the old TV asset name so nobody can accidentally
          # download a stale APK that was previously published under it.
          gh release delete-asset vueo-dev VUEO-TV-dev.apk -y \
            >/dev/null 2>&1 || true
          gh release delete-asset vueo-dev VUEO-TV-dev.apk.sha256 -y \
            >/dev/null 2>&1 || true

          gh release upload vueo-dev \
            dist/VUEO-dev.apk \
            dist/VUEO-dev.apk.sha256 \
            dist/VUEOTV-dev.apk \
            dist/VUEOTV-dev.apk.sha256 \
            dist/update.json \
            dist/tv-update.json \
            --clobber


      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO Central Build"
            echo
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
            echo "- Branch: \`main\`"
            echo "- Commit: \`$(git rev-parse HEAD 2>/dev/null || echo unknown)\`"
            echo "- Version: \`${VUEO_VERSION_NAME:-not-built}\`"
            echo "- Version code: \`${VUEO_VERSION_CODE:-not-built}\`"
            echo
            echo "### Release"
            echo "- Tag: \`vueo-dev\`"
            echo "- Mobile APK: \`VUEO-dev.apk\`"
            echo "- TV APK: \`VUEOTV-dev.apk\`"
            echo "- TV package: \`com.vueo.app.tv\`"
            echo "- Mobile update feed: \`update.json\`"
            echo "- TV update feed: \`tv-update.json\`"
            echo "- Manual TV testing: download \`VUEOTV-dev.apk\` directly from this Release"
            echo "- Actions ZIP artifact: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
