name: VUEO NEXT Foundation Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "tv/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build-vueo-apk-auto.yml"

permissions:
  contents: read

concurrency:
  group: vueo-next-foundation-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Shared Core, Mobile and TV
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --channel=0 \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build foundation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :shared:core:assembleDebug \
            :mobile:assembleDebug \
            :tv:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK package IDs
        shell: bash
        run: |
          set -euo pipefail

          MOBILE_APK="mobile/build/outputs/apk/debug/mobile-debug.apk"
          TV_APK="tv/build/outputs/apk/debug/tv-debug.apk"

          test -s "$MOBILE_APK" || {
            echo "::error::Mobile debug APK was not generated."
            exit 1
          }
          test -s "$TV_APK" || {
            echo "::error::TV debug APK was not generated."
            exit 1
          }

          AAPT="$(find "${ANDROID_HOME}" -path "*/build-tools/36.0.0/aapt" -print -quit)"
          test -x "$AAPT" || {
            echo "::error::aapt 36.0.0 was not found."
            exit 1
          }

          MOBILE_PACKAGE="$("$AAPT" dump badging "$MOBILE_APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          TV_PACKAGE="$("$AAPT" dump badging "$TV_APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"

          echo "Mobile APK package: $MOBILE_PACKAGE"
          echo "TV APK package: $TV_PACKAGE"

          test "$MOBILE_PACKAGE" = "com.vueo.app" || {
            echo "::error::Wrong Mobile package ID: $MOBILE_PACKAGE"
            exit 1
          }
          test "$TV_PACKAGE" = "com.vueo.tv" || {
            echo "::error::Wrong TV package ID: $TV_PACKAGE"
            exit 1
          }

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-NEXT-Mobile-Debug
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: VUEO-NEXT-TV-Debug
          path: tv/build/outputs/apk/debug/tv-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO NEXT Foundation"
            echo
            echo "- Shared Core: :shared:core"
            echo "- Mobile: com.vueo.app"
            echo "- TV: com.vueo.tv"
            echo "- Build type: Debug"
          } >> "$GITHUB_STEP_SUMMARY"
          
