name: VUEO Lean Build and Publish

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "tv/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build-vueo-apk-auto.yml"

permissions:
  contents: write

# Only the newest main build matters for the rolling dev release.
# Cancelling stale runs avoids wasting hosted-runner minutes.
concurrency:
  group: vueo-dev-publish
  cancel-in-progress: true

jobs:
  build-publish:
    name: Build once, verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VUEO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VUEO_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing VUEO_KEYSTORE_BASE64 or VUEO_KEYSTORE_PASSWORD."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew || {
            echo "::error::gradlew is missing."
            exit 1
          }

          test -f ./gradle/wrapper/gradle-wrapper.properties || {
            echo "::error::Gradle wrapper properties are missing."
            exit 1
          }

          chmod +x ./gradlew

      # setup-gradle provides Gradle User Home/build-cache reuse between runs.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Android SDK 36 tools
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not configured."
            exit 1
          fi

          MISSING=()
          [ -d "$SDK_ROOT/platforms/android-36" ] || MISSING+=("platforms;android-36")
          [ -x "$SDK_ROOT/build-tools/36.0.0/apksigner" ] || MISSING+=("build-tools;36.0.0")
          [ -x "$SDK_ROOT/platform-tools/adb" ] || MISSING+=("platform-tools")

          if [ "${#MISSING[@]}" -eq 0 ]; then
            echo "Android SDK 36 tools already present on runner; skipping sdkmanager download."
            exit 0
          fi

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --channel=0 "${MISSING[@]}"

      - name: Prepare signed release metadata
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VUEO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VUEO_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          VERSION_CODE="$(date -u +%s)"
          if [ "$VERSION_CODE" -ge 2100000000 ]; then
            echo "::error::Generated Android versionCode is too large."
            exit 1
          fi

          readarray -t BASE_VERSIONS < <(
            python3 <<'PY'
          from pathlib import Path
          import re

          def version(path: str, fallback: str) -> str:
              text = Path(path).read_text(encoding="utf-8")
              match = re.search(r'versionName\s*=.*?\?:\s*"([^"]+)"', text)
              if match:
                  return match.group(1).strip()
              match = re.search(r'versionName\s*=\s*"([^"]+)"', text)
              return match.group(1).strip() if match else fallback

          print(version("mobile/build.gradle.kts", "0.0.0"))
          print(version("tv/build.gradle.kts", "0.0.0"))
          PY
          )

          MOBILE_VERSION_NAME="${BASE_VERSIONS[0]}-dev.${VERSION_CODE}"
          TV_VERSION_NAME="${BASE_VERSIONS[1]}-dev.${VERSION_CODE}"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/vueo-dev-signing.jks"
          test -s "$RUNNER_TEMP/vueo-dev-signing.jks" || {
            echo "::error::Decoded signing keystore is empty."
            exit 1
          }

          {
            echo "VUEO_VERSION_CODE=$VERSION_CODE"
            echo "VUEO_VERSION_NAME=$MOBILE_VERSION_NAME"
            echo "VUEO_TV_VERSION_NAME=$TV_VERSION_NAME"
            echo "VUEO_KEYSTORE_PATH=$RUNNER_TEMP/vueo-dev-signing.jks"
            echo "VUEO_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "Mobile: $MOBILE_VERSION_NAME ($VERSION_CODE)"
          echo "TV:     $TV_VERSION_NAME ($VERSION_CODE)"

      - name: Build Mobile and TV release APKs once
        shell: bash
        run: |
          set -euo pipefail

          # One Gradle invocation lets :shared:core compile once and be reused by
          # both application graphs. No duplicate Debug build is performed.
          ./gradlew \
            :mobile:assembleRelease \
            :tv:assembleRelease \
            --build-cache \
            --parallel \
            --stacktrace

      - name: Locate and verify signed APKs
        shell: bash
        run: |
          set -euo pipefail

          MOBILE_APK="$(find mobile/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          TV_APK="$(find tv/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"

          test -n "$MOBILE_APK" && test -s "$MOBILE_APK" || {
            echo "::error::Mobile release APK was not generated."
            exit 1
          }
          test -n "$TV_APK" && test -s "$TV_APK" || {
            echo "::error::TV release APK was not generated."
            exit 1
          }

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"

          test -x "$APKSIGNER" || {
            echo "::error::apksigner 36.0.0 was not found."
            exit 1
          }
          test -x "$AAPT" || {
            echo "::error::aapt 36.0.0 was not found."
            exit 1
          }

          "$APKSIGNER" verify --verbose --print-certs "$MOBILE_APK"
          "$APKSIGNER" verify --verbose --print-certs "$TV_APK"

          MOBILE_PACKAGE="$(
            "$AAPT" dump badging "$MOBILE_APK" \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p" \
              | head -n 1
          )"
          TV_PACKAGE="$(
            "$AAPT" dump badging "$TV_APK" \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p" \
              | head -n 1
          )"

          [ "$MOBILE_PACKAGE" = "com.vueo.app" ] || {
            echo "::error::Wrong Mobile package: $MOBILE_PACKAGE"
            exit 1
          }
          [ "$TV_PACKAGE" = "com.vueo.tv" ] || {
            echo "::error::Wrong TV package: $TV_PACKAGE"
            exit 1
          }

          {
            echo "MOBILE_APK=$MOBILE_APK"
            echo "TV_APK=$TV_APK"
          } >> "$GITHUB_ENV"

          echo "Mobile package: $MOBILE_PACKAGE"
          echo "TV package: $TV_PACKAGE"

      - name: Prepare rolling release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          cp "$MOBILE_APK" dist/VUEO-dev.apk
          cp "$TV_APK" dist/VUEOTV-dev.apk

          MOBILE_SHA256="$(sha256sum dist/VUEO-dev.apk | awk '{print $1}')"
          TV_SHA256="$(sha256sum dist/VUEOTV-dev.apk | awk '{print $1}')"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          COMMIT_SHA="$(git rev-parse HEAD)"

          export MOBILE_SHA256 TV_SHA256 PUBLISHED_AT COMMIT_SHA

          python3 <<'PY'
          from pathlib import Path
          import json
          import os

          repo = os.environ["GITHUB_REPOSITORY"]
          code = int(os.environ["VUEO_VERSION_CODE"])
          commit = os.environ["COMMIT_SHA"]
          published = os.environ["PUBLISHED_AT"]

          mobile = {
              "schemaVersion": 1,
              "versionCode": code,
              "versionName": os.environ["VUEO_VERSION_NAME"],
              "title": "VUEO " + os.environ["VUEO_VERSION_NAME"],
              "changelog": [
                  "Latest successful VUEO development build",
                  "Commit " + commit[:7],
              ],
              "downloadUrl": f"https://github.com/{repo}/releases/download/vueo-dev/VUEO-dev.apk",
              "sha256": os.environ["MOBILE_SHA256"],
              "publishedAt": published,
          }

          tv = {
              "schemaVersion": 1,
              "versionCode": code,
              "versionName": os.environ["VUEO_TV_VERSION_NAME"],
              "title": "VUEO TV " + os.environ["VUEO_TV_VERSION_NAME"],
              "changelog": [
                  "Latest successful VUEO TV development build",
                  "Commit " + commit[:7],
              ],
              "downloadUrl": f"https://github.com/{repo}/releases/download/vueo-dev/VUEOTV-dev.apk",
              "sha256": os.environ["TV_SHA256"],
              "publishedAt": published,
          }

          Path("dist/update.json").write_text(json.dumps(mobile, indent=2) + "\n", encoding="utf-8")
          Path("dist/tv-update.json").write_text(json.dumps(tv, indent=2) + "\n", encoding="utf-8")
          PY

          sha256sum dist/VUEO-dev.apk > dist/VUEO-dev.apk.sha256
          sha256sum dist/VUEOTV-dev.apk > dist/VUEOTV-dev.apk.sha256

          echo "Release payload:"
          ls -lh dist/

      - name: Publish rolling VUEO Dev release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view vueo-dev >/dev/null 2>&1; then
            gh release create vueo-dev \
              --target "$GITHUB_SHA" \
              --title "VUEO Dev" \
              --prerelease \
              --notes "Rolling development release. Only successful signed builds are published."
          fi

          gh release upload vueo-dev \
            dist/VUEO-dev.apk \
            dist/VUEO-dev.apk.sha256 \
            dist/VUEOTV-dev.apk \
            dist/VUEOTV-dev.apk.sha256 \
            dist/update.json \
            dist/tv-update.json \
            --clobber

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VUEO Lean Build"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Mobile: \`${VUEO_VERSION_NAME:-not-built}\`"
            echo "- TV: \`${VUEO_TV_VERSION_NAME:-not-built}\`"
            echo "- Build mode: Release only"
            echo "- Gradle invocations: 1"
            echo "- Shared Core: compiled through the app dependency graph"
            echo "- Actions APK artifacts: disabled"
            echo "- Distribution: rolling \`vueo-dev\` GitHub Release"
            if [ -f dist/VUEO-dev.apk ]; then
              echo "- Mobile size: \`$(du -h dist/VUEO-dev.apk | cut -f1)\`"
            fi
            if [ -f dist/VUEOTV-dev.apk ]; then
              echo "- TV size: \`$(du -h dist/VUEOTV-dev.apk | cut -f1)\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          
