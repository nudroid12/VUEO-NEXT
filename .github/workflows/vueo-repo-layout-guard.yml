name: VUEO Repo Layout Guard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/vueo-repo-layout-guard.yml"

permissions:
  contents: write

concurrency:
  group: vueo-repo-layout-guard
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.3.1"
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Audit stray root source tree
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import hashlib

          root = Path("src/main")
          if not root.exists():
              print("No stray root src/main tree found.")
              raise SystemExit(0)

          def digest(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          unsafe = []

          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              rel = path.relative_to(root)
              parts = rel.parts
              candidates = []

              if len(parts) >= 4 and parts[:4] == ("java", "com", "vueo", "app"):
                  candidates = [Path("mobile/src/main") / rel]
              elif len(parts) >= 4 and parts[:4] == ("java", "com", "vueo", "tv"):
                  candidates = [Path("tv/src/main") / rel]
              elif rel.as_posix() == "AndroidManifest.xml":
                  candidates = [
                      Path("mobile/src/main/AndroidManifest.xml"),
                      Path("tv/src/main/AndroidManifest.xml"),
                  ]
              elif parts and parts[0] == "res":
                  # Root res/ came from an earlier flattened module patch.
                  # Accept deletion only when the exact file already exists
                  # in Mobile or TV.
                  candidates = [
                      Path("mobile/src/main") / rel,
                      Path("tv/src/main") / rel,
                  ]
              else:
                  unsafe.append(f"{rel.as_posix()} (unmapped)")
                  continue

              root_hash = digest(path)
              identical = [
                  candidate for candidate in candidates
                  if candidate.is_file() and digest(candidate) == root_hash
              ]

              if not identical:
                  existing = [str(c) for c in candidates if c.is_file()]
                  if existing:
                      unsafe.append(
                          f"{rel.as_posix()} differs from canonical copy/copies: "
                          + ", ".join(existing)
                      )
                  else:
                      unsafe.append(
                          f"{rel.as_posix()} has no canonical Mobile/TV counterpart"
                      )

          if unsafe:
              print("Stray root files that are NOT safe to delete:")
              for item in unsafe:
                  print("  ", item)
              raise SystemExit(
                  "Refusing cleanup because unique or modified root files still exist."
              )

          print("Audit passed: every root src/main file is an exact duplicate of a canonical module file.")
          PY

      - name: Remove stray root source tree
        shell: bash
        run: |
          set -euo pipefail
          if [ -d src ]; then
            rm -rf src
            echo "Removed duplicate root src/ tree."
          else
            echo "Root src/ already absent."
          fi

      - name: Verify canonical module layout
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src
          test -f mobile/build.gradle.kts
          test -f tv/build.gradle.kts
          test -f shared/core/build.gradle.kts
          grep -Fq 'include(":mobile")' settings.gradle.kts
          grep -Fq 'include(":tv")' settings.gradle.kts
          grep -Fq 'include(":shared:core")' settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
          log-accepted-android-sdk-licenses: "false"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Final Mobile + TV + Shared build
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            :shared:core:assembleDebug \
            :mobile:assembleDebug \
            :tv:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify final package IDs
        shell: bash
        run: |
          set -euo pipefail

          MOBILE_APK="mobile/build/outputs/apk/debug/mobile-debug.apk"
          TV_APK="tv/build/outputs/apk/debug/tv-debug.apk"
          AAPT="$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/aapt"

          test -s "$MOBILE_APK"
          test -s "$TV_APK"

          MOBILE_PACKAGE="$($AAPT dump badging "$MOBILE_APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          TV_PACKAGE="$($AAPT dump badging "$TV_APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"

          test "$MOBILE_PACKAGE" = "com.vueo.app"
          test "$TV_PACKAGE" = "com.vueo.tv"

          echo "Mobile: $MOBILE_PACKAGE"
          echo "TV: $TV_PACKAGE"

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore: remove duplicate root source tree"
          git push origin HEAD:main
          
