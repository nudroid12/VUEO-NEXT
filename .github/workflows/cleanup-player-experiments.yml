# Put this file at .github/workflows/cleanup-player-experiments.yml.
# After Phase 23 is overlaid: Actions > Cleanup Player Experiments > Run workflow.
# This workflow deletes only the 19 obsolete Phase 19-22 files and pushes one commit.
# Run the existing APK build workflow afterwards. No existing workflow is modified.
name: Cleanup Player Experiments

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vueo-player-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Remove obsolete player files and push cleanup commit
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          python3 <<'PYTHON'
          import os
          import subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def git(*args, capture=False):
              result = subprocess.run(["git", *args], check=True, text=True,
                                      stdout=subprocess.PIPE if capture else None)
              return result.stdout.strip() if capture else None

          def require(ok, message):
              if not ok:
                  raise SystemExit(message)

          branch = os.environ["TARGET_BRANCH"]
          require(os.environ.get("REF_TYPE") == "branch", "Run this workflow on a branch, not a tag.")
          require(git("symbolic-ref", "--short", "HEAD", capture=True) == branch,
                  "Checkout branch does not match the selected branch.")
          require(not git("status", "--porcelain", capture=True), "Checkout must be clean before cleanup.")

          # Require the Phase 23 replacement code before removing the old implementation.
          required = {
              "shared/core/build.gradle.kts": ["libvlc", "consumerProguardFiles"],
              "shared/core/src/main/java/com/vueo/shared/core/player/VideoDecoderRecovery.kt": ["VideoDecoderSession", "allowSynchronous"],
              "mobile/src/main/java/com/vueo/mobile/ui/player/MobilePlayer.kt": ["SoftwarePlayback", "ExternalVlc", "SourcePlaybackTarget", "VideoDecoderSession"],
              "mobile/src/main/java/com/vueo/mobile/ui/player/PlayerSourcesWorkspace.kt": ["SoftwarePlayback", "ExternalVlc", "SourcePlaybackTarget", "onSoftwareSelect", "onVlcSelect"],
              "tv/src/main/java/com/vueo/tv/ui/player/TvPlayerScreen.kt": ["SoftwarePlayback", "ExternalVlc", "SourcePlaybackTarget", "VideoDecoderSession"],
          }
          for filename, obsolete in required.items():
              path = Path(filename)
              require(path.is_file(), f"Missing {filename}. Apply Phase 23 before running cleanup.")
              text = path.read_text()
              require(not any(token in text for token in obsolete),
                      f"Phase 23 replacement is missing in {filename}. Apply Phase 23 first.")
          for filename in [
              "mobile/src/main/java/com/vueo/mobile/ui/player/MobilePlayerTracks.kt",
              "tv/src/main/java/com/vueo/tv/ui/player/TvPlayerTracks.kt",
          ]:
              text = Path(filename).read_text()
              require("DefaultRenderersFactory(context)" in text and "setEnableDecoderFallback(true)" in text
                      and "CompatibleVideoRenderersFactory" not in text and "VideoDecoderSession" not in text,
                      f"Apply the Phase 23 subtitle renderer replacement: {filename}")
          ns = "{http://schemas.android.com/apk/res/android}"
          manifest = ET.parse("shared/core/src/main/AndroidManifest.xml").getroot()
          require(not any(node.get(ns + "name", "").endswith(("SoftwarePlaybackActivity", "ExternalVlcActivity"))
                          for node in manifest.findall("./application/activity")),
                  "Apply the Phase 23 manifest before deleting its old activity classes.")
          require(not any(node.get(ns + "name") == "org.videolan.vlc"
                          for node in manifest.findall("./queries/package")),
                  "Apply the Phase 23 manifest to remove the VLC query.")

          # Exact allowlist from Phase 23 DELETE_FILES.md; never scan/delete by wildcard.
          obsolete_files = [
              "shared/core/src/main/java/com/vueo/shared/core/player/SoftwarePlaybackActivity.kt",
              "shared/core/src/main/java/com/vueo/shared/core/player/SoftwarePlaybackPolicy.kt",
              "shared/core/src/main/java/com/vueo/shared/core/player/ExternalVlcActivity.kt",
              "shared/core/src/main/java/com/vueo/shared/core/player/ExternalVlcPolicy.kt",
              "shared/core/src/main/java/com/vueo/shared/core/player/CompatibleVideoRenderersFactory.kt",
              "shared/core/src/main/java/com/vueo/shared/core/player/VideoDecoderSession.kt",
              "shared/core/src/main/java/com/vueo/shared/core/player/VideoCodecPolicy.kt",
              "shared/core/src/main/java/com/vueo/shared/core/player/VideoQueueingPolicy.kt",
              "shared/core/consumer-rules.pro",
              "shared/core/src/main/assets/licenses/LibVLC-LGPL-2.1.txt",
              "shared/core/src/main/assets/licenses/LibVLC-NOTICE.txt",
              "validation/software-playback/SoftwarePlaybackPolicyCheck.kt",
              "validation/external-vlc/ExternalVlcPolicyCheck.kt",
              "validation/video-decoder-recovery/VideoCodecPolicyCheck.kt",
              "validation/video-decoder-recovery/VideoQueueingPolicyCheck.kt",
              "PATCH_NOTES_SOFTWARE_PLAYBACK_PHASE_21.md",
              "PATCH_NOTES_EXTERNAL_VLC_PHASE_22.md",
              "PATCH_NOTES_VIDEO_DECODER_RECOVERY_PHASE_19.md",
              "PATCH_NOTES_VIDEO_QUEUEING_PHASE_20.md"
          ]
          git("rm", "--ignore-unmatch", "--", *obsolete_files)
          staged = git("diff", "--cached", "--name-status", "--no-renames", capture=True)
          deleted = []
          for line in staged.splitlines():
              status, filename = line.split("\t", 1)
              require(status == "D" and filename in obsolete_files,
                      f"Refusing unexpected staged change: {line}")
              deleted.append(filename)

          if deleted:
              git("-c", "user.name=github-actions[bot]",
                  "-c", "user.email=41898282+github-actions[bot]@users.noreply.github.com",
                  "commit", "-m", "chore: remove obsolete playback experiments [player-cleanup]")
              # Normal push only. Concurrent changes or branch protection must never be overridden.
              git("push", "origin", f"HEAD:refs/heads/{branch}")
              outcome = f"Deleted and pushed {len(deleted)} obsolete files."
          else:
              outcome = "Already clean: no obsolete tracked files remain. No commit needed."

          print(outcome)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Player experiment cleanup\n\n" + outcome + "\n\n")
              summary.write("Selected branch: `" + branch + "`\n\n")
              for filename in deleted:
                  summary.write("- `" + filename + "`\n")
              summary.write("\nRun your existing APK build workflow manually after cleanup.\n")
          PYTHON
