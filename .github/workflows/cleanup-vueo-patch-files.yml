          PATCH_GENERIC_SRT_REPO55.txt
          PATCH_NOTES.txt
          PATCH_NOTES_ADDON_INSTALLATION_IDENTITY_PHASE_14_TV_MOBILE.md
          PATCH_NOTES_ADDON_RESPONSE_LIMIT_PHASE_9.md
          PATCH_NOTES_ENTITY_RESULTS_BACKGROUND_PHASE_13_TV_MOBILE.md
          PATCH_NOTES_METADATA_CACHE_PHASE_7.md
          PATCH_NOTES_MOBILE_ADDON_RELOAD_PHASE_4.md
          PATCH_NOTES_MOBILE_DIAGNOSTICS_LIBRARY_IO_PHASE_5.md
          PATCH_NOTES_MOBILE_HOME_PROFILE_STATE_PHASE_3.md
          PATCH_NOTES_MOBILE_IMAGE_CACHE_PHASE_1.md
          PATCH_NOTES_MOBILE_NAVIGATION_RESTORE_PHASE_11.md
          PATCH_NOTES_MOBILE_PLAYER_LIFECYCLE_PHASE_2.md
          PATCH_NOTES_MOBILE_PLAYER_RESOURCES_PHASE_12.md
          PATCH_NOTES_MOBILE_PROFILE_CANCEL_AVATAR_PHASE_8.md
          PATCH_NOTES_MOBILE_SEARCH_BACKGROUND_PHASE_10.md
          PATCH_NOTES_PLAYER_CLEANUP_PHASE_23.md
          PATCH_NOTES_PLAYER_FRAME_CONTINUITY_PHASE_17.md
          PATCH_NOTES_PROVIDER_CODE_SYNC_PHASE_6.md
          PATCH_NOTES_SMARTSUBS_LIVE_OVERLAY_PHASE_18.md
          PATCH_NOTES_TV_PLAYER_EPISODE_ARTWORK_PHASE_15.md
          PATCH_NOTES_USER_COLLECTIONS_PHASE_16.md
          PATCH_NOTES_v105.txt
          PATCH_PLAYBACK_HTTP_REQUEST_TRACE.txt
          PATCH_README.md
          PATCH_README.txt
          PATCH_SHARED_HTTP_TRANSPORT.txt
          PATCH_SOURCES_STATUS_FIX.txt
          PATCH_STABLE_SOURCE_ROWS.txt
          PATCH_SUBTITLE_AES_CACHE.txt
          PATCH_SUBTITLE_FIRST_PREPARATION.md
          PATCH_SUBTITLE_NORMALIZER_LINEAR.md
          PATCH_SUBTITLE_TIMING.md
          PATCH_TV_ACCOUNT_REPOSITORY_COMPACT.txt
          PATCH_TV_FOCUS_TABS.txt
          PATCH_TV_SUBTITLE_LAYOUT_ROLLBACK.md
