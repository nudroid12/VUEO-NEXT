name: Cleanup VUEO Patch Files

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Delete listed files and commit to main (unchecked = preview)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vueo-zip-patch
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check and clean up patch leftovers
        env:
          APPLY: ${{ inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os
          import subprocess
          import zipfile
          from pathlib import Path, PurePosixPath

          known_leftovers = set('''
          ADAPTIVE-DISCOVERY-AI-SUBS-NOTES.txt
          AFTER_PREVIOUS_PATCH.diff
          BASELINE_SHA256.txt
          CACHE_BRIDGE.diff
          CHANGES.diff
          CHANNEL-JSON-BUILD-FIX.txt
          DELETE_FILES.md
          DELETE_FILES.txt
          DELETE_FILES_ROLLBACK_SUBTITLES.md
          ICON-SOURCES-PATCH-NOTES.txt
          LAUNCHER-CHANNELS-NOTES.txt
          PATCH-NOTES.md
          PATCH-NOTES.txt
          PATCH_COMBINED_REANIME_VIDSRC_REPO53.txt
          PATCH_CONTENT_MANAGER.txt
          PATCH_CROSS_PROVIDER_SUBTITLES.txt
