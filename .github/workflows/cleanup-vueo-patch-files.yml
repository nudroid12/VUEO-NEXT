          README_V132.txt
          README_V133.txt
          README_V134.txt
          README_V74.txt
          README_V80.txt
          README_V81.txt
          README_V82.txt
          README_V83.txt
          README_V89.txt
          README_V90.txt
          README_V91.txt
          README_V92.txt
          README_V93.txt
          README_V94.txt
          README_V95.txt
          README_V96.txt
          README_V98.txt
          README_WATCHED_INDICATOR.txt
          REMOVE-RECOMMENDED-NOTES.txt
          TV-Profile-Patch-Notes.txt
          TV_ENGLISH_VTT_POSITION_FIX.diff
          VALIDATION-RESTORED-FILE-HASHES.txt
          VUEO-Account-Sync-All-Credentials-Only-Notes.md
          VUEO-Content-Manager-Rollback-Notes.md
          VUEO-For-You-Rebuild-Notes.md
          VUEO-For-You-Shared-DNA-Notes.txt
          VUEO-For-You-Trakt-Only-Notes.md
          VUEO-Gemini-Enhancement-Patch-Notes.txt
          VUEO-Gemini-Fixed-Backend-Patch-Notes.txt
          VUEO-Home-Recommendations-Loading-Cache-Notes.md
          VUEO-Mobile-Account-Compact-Polish-v2-Notes.txt
          VUEO-Mobile-Account-One-Card-Notes.txt
          VUEO-Personalization-Enhancement-Separate-Rows-Notes.md
          VUEO-Plugin-Subtitle-Provider-Only-Notes.md
          VUEO-SmartSubs-Open-Diagnose-Status-Notes.txt
          VUEO-SmartSubs-Player-Integration-Notes.txt
          VUEO-SmartSubs-Player-Track-Attach-Notes.txt
          VUEO-SmartSubs-Plugin-Only-Candidates-Notes.txt
          VUEO-SmartSubs-Subtitle-Display-Notes.txt
          VUEO-TV-DNA-Inline-Notes.md
          VUEO-TV-DNA-Off-Guard-Notes.md
          VUEO-TV-Details-DNA-Match-Notes.md
          VUEO-TV-Gemini-Menu-Fix-Notes.txt
          VUEO-TV-Repo-Trash-Compact-Provider-Polish-Notes.txt
          VUEO-TV-Settings-Polish-Notes.md
          VUEO_v105.diff
          VUEO_v107.diff
          '''.splitlines()) - {''}

          def git(*args):
              return subprocess.check_output(['git', *args])

          def already_applied(archive, tracked):
              # Only approved packaging metadata may differ from the checkout.
              metadata = {'README.md', 'PATCH_README.md', 'CHANGES.diff', 'AFTER_PREVIOUS_PATCH.diff'}
              matched = False
              try:
                  with zipfile.ZipFile(archive) as patch:
                      for item in patch.infolist():
                          path = PurePosixPath(item.filename)
                          if path.is_absolute() or '..' in path.parts:
                              return False
                          if item.is_dir() or item.filename in metadata:
                              continue
                          if item.filename not in tracked:
                              return False
                          actual = Path(item.filename)
                          if actual.is_symlink() or actual.stat().st_size != item.file_size:
                              return False
                          if actual.read_bytes() != patch.read(item):
                              return False
                          matched = True
              except (OSError, RuntimeError, NotImplementedError, zipfile.BadZipFile):
                  return False
              return matched

          tracked = set(os.fsdecode(p) for p in git('ls-files', '-z').split(b'\0') if p)
          archives = sorted(p for p in tracked if '/' not in p and p.startswith('VUEO-') and p.endswith('.zip'))
          verified_archives = {p for p in archives if already_applied(p, tracked)}
          candidates = sorted((known_leftovers & tracked) | verified_archives)
          # Exclude candidate files when searching, since patch notes commonly cite one another.
          search_paths = ['.', ':(top,exclude,literal).github/workflows/cleanup-vueo-patch-files.yml', *[f':(top,exclude,literal){p}' for p in candidates]]
          selected = []
          kept = []
          for path in candidates:
              result = subprocess.run(['git', 'grep', '-I', '-F', '-l', '-e', path, '--', *search_paths],
                                      stdout=subprocess.PIPE, check=False)
              if result.returncode == 0:
                  kept.append(path)
              elif result.returncode == 1:
                  selected.append(path)
              else:
                  raise SystemExit(f'Unable to check references to {path}')

          apply = os.environ['APPLY'] == 'true'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              print('## VUEO cleanup ' + ('apply' if apply else 'preview'), file=summary)
              print(f'\n{len(selected)} file(s) selected.', file=summary)
              for path in selected:
                  print(f'- `{path}`', file=summary)
              skipped = sorted(set(archives) - verified_archives)
              if kept or skipped:
                  print('\n### Kept', file=summary)
                  for path in kept:
                      print(f'- `{path}` (referenced by another tracked file)', file=summary)
                  for path in skipped:
                      print(f'- `{path}` (contents do not match the checkout)', file=summary)

          if apply and selected:
              git('rm', '--', *selected)
          PYTHON

          if [[ "$APPLY" != true ]]; then
            exit 0
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Clean up old VUEO patch files'
          git push origin HEAD:main
