          README-JSON-Source-Early-Return.md
          README-LIBRARY-HISTORY.txt
          README-PLAYER-EXIT.txt
          README-ROLLBACK-SUBTITLES.txt
          README.txt
          README_ACTIVE_CUE_REFRESH.md
          README_AI_INITIAL_POSITION.md
          README_CLEANUP.md
          README_DISCOVERY_INTEGRITY.md
          README_MANIFEST_URL.md
          README_MOBILE_SCALE_CROSS_TRANSITION.txt
          README_MOBILE_SCALE_CROSS_TRANSITION_v78.txt
          README_NATIVE_POSITION.md
          README_PATCH.txt
          README_PHASE1.txt
          README_PHASE2.txt
          README_PHASE3.txt
          README_PHASE4.txt
          README_PROVIDER_STATUS.md
          README_SUBTITLE_TRANSFORMS.txt
          README_TABS_TIME.md
          README_TV_SCALE_CROSS_TRANSITION_v79.txt
